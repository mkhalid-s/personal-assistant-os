# Import GitHub Actions CI only. Do not list publish.yml or release.yml:
# those workflows are GitHub-hosted (OIDC trusted publishing / tag release
# gates). The github-actions plugin rejects GitHub Environments, which is
# what failed Buildkite when publish.yml was compiled.
agents:
  queue: linux-small

steps:
  - label: ":github: GitHub Actions"
    key: github-actions
    plugins:
      - github-actions#latest:
          workflow: .github/workflows/ci.yml
          runners:
            - runs-on: ubuntu-latest
              queue: linux-small
            - runs-on: macos-14
              queue: linux-small
