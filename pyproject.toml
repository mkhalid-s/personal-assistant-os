[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-os"
version = "0.1.0"
description = "Local-first CLI personal assistant for Staff+ engineering workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["anthropic>=0.69"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
voice = ["sounddevice", "faster-whisper"]

[project.scripts]
myos = "personal_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_assistant = ["route_eval_fixtures.json", "model_prices.json"]

# Ruff configuration. CI runs both lint and format checks fatally across
# the complete source and test trees, with an additional explicit pass over
# the safety-critical modules.
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    # Line-too-long is enforced by format; leave the check off so long docstrings
    # and inline SQL do not trip it.
    "E501",
    # `sqlite3` uses `Row` objects heavily; `SIM118` prefers .keys() calls we do not want.
    "SIM118",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
